name: Release gate

# 发布验收：构建内核 → 真浏览器跑 E2E → 校验「确实跑了」。
#
# 为什么不放在常态 CI 里：内核要 emsdk 2.0.34 + JDK + 完整的 emcc 构建，
# 单次 20 分钟以上；而常态 CI 的每次 push 都跑一遍没有意义。
# 但**发布**必须跑，而且跑不到时要红 —— 这一条由本工作流负责：
#   1. `.github/workflows/ci.yml` 的 kernel-smoke 只做「用例能加载」；
#   2. 本工作流的 kernel-e2e 缺产物、用例被跳过，全部判失败。
#
# 测试游戏不需要另外准备：E2E 用的是随包分发的自研推箱子
# （`public/games/sokoban.data`，见 `tests/e2e/game.ts`）。曾经这里有一段
# 「从 secret 还原测试包」的步骤，但还原出来的文件名与用例要的名字不一致，
# 于是「配了 secret 也跑不起来」—— 现在没有这个环节，也就没有这个失败面。
#
# 触发：
#   - 推 `v*` 标签：自动构建内核并跑全量 E2E；
#   - 手动触发：`kernel=build` 从上游重建（默认），`kernel=require` 只接受
#     已经放在工作区里的产物（自建 runner / 预先解压的缓存）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      kernel:
        description: '内核产物来源：build = 从上游重建（约 20 分钟）；require = 必须已就位'
        type: choice
        options: ['build', 'require']
        default: 'build'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel-e2e:
    name: 真内核 E2E（发布验收 · 跑不到即失败）
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # 构建脚本默认用 .work/emsdk；放家目录便于缓存。
      EMSDK_DIR: ${{ github.workspace }}/.emsdk
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 随包的 104 款游戏（含 E2E 要用的推箱子）是入库文件，先核对一遍。
      # 放在构建内核之前：这一步几秒钟，能省掉「等 20 分钟才发现仓库不完整」。
      - name: 校验随包游戏资产
        run: npm run check:games

      # 自研 6 款按 GPL-2.0-or-later 要随二进制提供对应源码。发布前确认源码在
      # 仓库里、且与随包产物对得上（类名 / MIDlet-1 / 主类条目）。
      # 更严格的一步是 `npm run verify:midlets`：重编译后逐 class 比字节。
      # 它不进这里，是因为「字节一致」依赖 javac 版本 —— 本机 JDK 27 实测一致，
      # 而 CI 是 JDK 17，把版本差异做成发布门禁只会得到一个偶发红。
      - name: 校验自研源码与产物
        run: npm run check:midlets

      # 发布物里带着 GPL 与 MIT 的许可原文（public/licenses/）。它是「分发时
      # 附上许可」这件事的物证，与仓库正本不一致就等于发出去一份过期许可。
      - name: 校验随包许可原文
        run: npm run check:licenses

      # ─────────────────────────── 内核 ───────────────────────────
      - name: 安装构建依赖
        if: github.event_name != 'workflow_dispatch' || inputs.kernel == 'build'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential openjdk-17-jdk-headless python3 make git
          java -version
          python3 --version

      - name: 缓存 emsdk
        if: github.event_name != 'workflow_dispatch' || inputs.kernel == 'build'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.emsdk
          key: emsdk-2.0.34-${{ runner.os }}

      - name: 安装 emsdk 2.0.34
        if: github.event_name != 'workflow_dispatch' || inputs.kernel == 'build'
        run: |
          if [ ! -f "$EMSDK_DIR/emsdk_env.sh" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          fi
          "$EMSDK_DIR/emsdk" install 2.0.34
          "$EMSDK_DIR/emsdk" activate 2.0.34

      - name: 构建内核（产物不入库）
        if: github.event_name != 'workflow_dispatch' || inputs.kernel == 'build'
        timeout-minutes: 60
        run: |
          bash scripts/fetch-upstream.sh
          bash scripts/build-kernel.sh

      # 产物必须真的存在。REQUIRE_KERNEL=1 会关掉「缺了就跳过」的退路。
      - name: 校验内核产物
        env:
          REQUIRE_KERNEL: '1'
        run: npm run check:kernels

      # ─────────────────────────── 测试 ───────────────────────────
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 真内核 E2E
        run: npx playwright test --reporter=list,json

      # 关键的一步：`playwright test` 在全部跳过时退出码是 0。
      # 没有这一步，「缺产物 → 全部 skip」会被记成发布验收通过。
      - name: 校验 E2E 报告（0 通过 / 有跳过 一律失败）
        if: always()
        run: node scripts/verify-e2e-report.mjs test-results/e2e.json

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-report
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  # 汇总任务：只有 kernel-e2e 成功它才会跑。给发布页一个「真的跑过了」的标记。
  release-gate:
    name: 发布验收通过（需 kernel-e2e 全绿）
    needs: kernel-e2e
    runs-on: ubuntu-latest
    steps:
      - run: echo "真内核 E2E 已实际执行并通过：$(date -u +%FT%TZ)"
