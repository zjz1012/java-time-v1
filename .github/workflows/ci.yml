name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check:provenance
      # 内置游戏的清单是生成物：这里核对「catalog ↔ public/games ↔ 真实字节」
      # 三者一致（逐款重算 sha256）。改了清单没重跑生成脚本会在这里红。
      - run: npm run check:games
      # 六款自研游戏的源码与产物必须对得上（类名、MIDlet-1、主类条目、catalog）。
      # 不需要 JDK：完整的「重编译后逐字节比对」见 npm run verify:midlets。
      - run: npm run check:midlets
      # 随包分发的许可原文（public/licenses/）必须与仓库正本逐字节一致：
      # 改了 LICENSE 忘了同步副本，构建照样成功，用户点开的却是旧许可。
      - run: npm run check:licenses

      # 内核产物不入库，CI 里不构建；脚本在产物缺失时直接跳过。
      # 真正需要校验产物时，在发布流程里构建后再跑。
      - run: npm run check:kernels

      - run: npm run build

  # 真内核冒烟：把 JAR 喂进 PluotSorbet，验证启动 / 输入 / 退出 / 再次启动。
  #
  # ★ 名字里写清「仅加载校验」是刻意的：内核产物按设计不入库（GPL-2.0 衍生
  #   作品，按发布策略单独处理），所以常态 CI 里这个 job **不执行任何内核
  #   测试**，只确认用例能被加载（语法、导入路径、配置）。
  #   测试游戏用的是随包分发的 public/games/sokoban.data（入库），不需要 secret。
  #   它变绿不代表真内核 E2E 通过 —— 那件事归 .github/workflows/release.yml。
  kernel-smoke:
    name: kernel-smoke（仅加载校验，不执行内核）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 检测内核产物
        id: prereq
        run: |
          if [ -f public/kernel/main-all.js ] && [ -f public/games/sokoban.data ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=真内核冒烟未执行::本 job 只做加载校验。内核产物不在仓库里；发布验收请在 release.yml 里跑（推 v* 标签或手动触发）。"
          fi

      # 即使没有产物也要确认用例能被加载：语法错误、导入路径写错、
      # 配置失效，这些都该在这里就红，而不是等到有人本地跑才发现。
      - name: 校验用例可被加载
        run: npx playwright test --list

      - if: steps.prereq.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.prereq.outputs.ready == 'true'
        run: npm run test:e2e
