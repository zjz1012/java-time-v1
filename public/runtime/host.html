<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>J2ME 运行宿主</title>

    <!--
      ★ base 是整条链上唯一的路径耦合，改动前请读 docs/architecture/kernel-contract.md §4。

      main-all.js 里写死了 load("java/classes.data")，而 load() 是相对「文档 base URL」
      的 XHR。宿主页在 /runtime/，产物在 /kernel/，因此必须用 base 把相对基准挪过去，
      否则类库会请求 /runtime/java/classes.data 并 404 —— 而 404 的表现是 loadingPromises
      被 reject，页面停在启动层、没有任何可见错误。

      用相对值而不是 "/kernel/"，是为了子路径部署（如 GitHub Pages 项目页）也能正确解析。
    -->
    <base href="../kernel/" />

    <style>
      /* 只承担内核需要的布局，不含任何产品样式。父页面负责 iframe 的大小与位置。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* #display 的 clientWidth/clientHeight 会被内核当成物理屏幕尺寸，
         所以它必须有非零尺寸，且由 iframe 的尺寸决定。 */
      #display-container,
      #display {
        position: absolute;
        inset: 0;
      }

      #display {
        overflow: hidden;
      }

      #main {
        position: absolute;
        inset: 0;
      }

      /* 宽高由内核在 updateCanvas 里按 #display 的尺寸设置；这里只管定位与观感。 */
      #canvas {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        background: #000;
        image-rendering: pixelated;
      }

      .screen {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #0b0e12;
        color: #c8d6d0;
        font: 14px/1.5 system-ui, sans-serif;
      }

      #exit-screen {
        z-index: 30;
        background: rgba(0, 0, 0, 0.72);
      }

      #lcdui-alert {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: none;
      }

      #back-button {
        position: absolute;
        left: 0;
        bottom: 0;
      }

      /* 内核用 offsetHeight 量文本高度来估算输入框，所以不能用 display:none。
         移出视口 + visibility:hidden 才能既不可见又有布局尺寸。 */
      #hidden-textarea-editor {
        position: absolute;
        left: -9999px;
        top: 0;
        visibility: hidden;
        white-space: pre-wrap;
      }

      #textarea-editor {
        position: absolute;
        left: 0;
        top: 0;
        outline: none;
      }
    </style>
  </head>
  <body>
    <!--
      DOM 骨架按内核实际引用反推，多于必需的部分都是有代码路径会直接取用、且不做空检查。
      清单与依据见 docs/architecture/kernel-contract.md §3。
    -->
    <div id="display-container">
      <div id="display">
        <!-- 侧栏：内核会读写 nav ul 并填充软键菜单 -->
        <section id="sidebar" data-type="sidebar" style="display: none">
          <header><h1>Menu</h1></header>
          <nav><ul></ul></nav>
        </section>

        <section id="drawer" role="region">
          <!-- header 的 offsetHeight 参与画布高度计算。隐藏时高度为 0，即画面占满。 -->
          <header style="display: none">
            <a id="header-drawer-button" href="#drawer" style="display: none"></a>
            <menu id="header-ok-button" type="toolbar" style="display: none">
              <button type="button">OK</button>
            </menu>
            <h1 id="display_title"></h1>
          </header>

          <div id="main" role="main">
            <canvas id="canvas"></canvas>

            <!-- 两个 screen 都是顶层无条件访问的：main-all.js 会直接读它们的 style，
                 节点缺失会在解析期抛 TypeError，而不是在某个分支里才失败。 -->
            <div id="download-screen" class="screen">
              <div>
                <h1 style="font-size: 15px; margin: 0 0 8px">下载中…</h1>
                <progress class="pack-activity" value="0" max="100"></progress>
              </div>
            </div>

            <div id="splash-screen" class="screen">
              <div>
                <h1 style="font-size: 15px; margin: 0 0 8px">启动中…</h1>
                <progress max="100"></progress>
              </div>
            </div>

            <div id="textarea-editor" contenteditable="true" style="display: none"></div>
            <div id="hidden-textarea-editor"></div>
            <button id="back-button" type="button" style="display: none">Back</button>
          </div>
        </section>

        <div id="exit-screen" class="screen"></div>

        <!-- Alert 的模板节点：内核 clone 它并把副本挂到父节点上，
             所以 h1.title / p.text / progress 这三个内部结构必须存在。 -->
        <form id="lcdui-alert">
          <section>
            <h1 class="title"></h1>
            <p class="text"></p>
            <p><progress style="display: none"></progress></p>
          </section>
          <menu>
            <button class="button0" type="button" style="display: none"></button>
            <button class="button1" type="button" style="display: none"></button>
            <button class="button2" type="button" style="display: none"></button>
          </menu>
        </form>

        <!-- 按需功能（文件选择框 / 短信验证码）。V1.0 不实现，但保留骨架，
             避免某款游戏触发对应原生方法时因模板为 null 而中断。 -->
        <div id="nokia-fileui-prompt" style="display: none">
          <input type="file" />
          <button class="recommend" type="button"></button>
          <button class="cancel" type="button"></button>
        </div>
        <div id="sms-listener-prompt" style="display: none">
          <p class="verificationText"></p>
          <input type="text" />
          <p class="timeLeft"></p>
          <progress class="timeLeftBar" max="100"></progress>
          <button class="cancel" type="button"></button>
          <button class="recommend" type="button"></button>
        </div>
      </div>
    </div>

    <script>
      /*
       * 宿主代理：在 iframe 内装配内核、把父页面的指令翻译成内核能懂的东西。
       *
       * 三条不可改的约束（都来自产物实测，见 kernel-contract.md）：
       *   1. 必须是非 module 的经典脚本 —— config 得是全局，module 作用域下 main-all.js 读不到；
       *   2. 三件产物必须按 j2me → native → main-all 顺序加载，main-all 末尾是立即执行的顶层语句；
       *   3. 内核没有「启动完成」事件，只能靠画布是否出画来判定。
       */
      ;(function () {
        'use strict'

        var PROTOCOL = 1
        var START_TIMEOUT_MS = 20000
        var POLL_INTERVAL_MS = 700

        /*
         * 存档相关的常量。全部来自对内核产物的实测（ADR 0005）：
         *
         *   RMS 落在 RECORD_STORE_BASE + "/" + filenameBase + "/" + name + "." + ext
         *   而 filenameBase 恒为空串（MIDletSuiteStorage.getSecureFilenameBase 返回 ""），
         *   所以用户数据就在 /RecordStore 下面，且**不区分游戏**。
         *
         *   IDB 的库名/版本/表名硬编码在内核里（Store.DBNAME / DBVERSION / DBSTORENAME_4），
         *   这里复制一份。这是本方案唯一越过内核接口去摸内部存储的地方 ——
         *   内核升级时若这几个常量变了，恢复会静默失效，所以升级必须复核。
         */
        var SNAPSHOT_ROOT = '/RecordStore'
        var IDB_NAME = 'asyncStorage'
        var IDB_VERSION = 4
        var IDB_STORE = 'fs4'

        /*
         * 静默期归档的节奏。
         *
         * 为什么不是「一变就传」：一次存档可能跨 .db 与 .idx 两个文件，
         * 中途读会得到索引与数据不一致的快照。等连续两轮（约 4 秒）没有变化
         * 才读，代价是归档滞后几秒，换来的是「不会归档一个半写状态」。
         */
        var IDLE_INTERVAL_MS = 2000
        var IDLE_STABLE_TICKS = 2

        var parentWindow = window.parent !== window ? window.parent : null
        var targetOrigin = location.origin
        var phase = 'boot'
        var jarUrl = null
        var pollTimer = 0

        /** 静默期归档用的三个状态：上一轮签名、连续稳定轮数、已归档过的签名。 */
        var idleTimer = 0
        var idleSignature = ''
        var idleStable = 0
        var archivedSignature = ''

        /** 物理键 code → 逻辑控制名。由外壳在启动指令里下发，宿主不自己发明。 */
        var keymap = {}
        /** 已按下但未抬起的控制名。失焦时靠它把键全部抬起来，否则游戏里会卡住。 */
        var heldControls = {}
        var warnedKeys = {}

        /*
         * 逻辑控制名 → **设备键码**。这张表的每一项都不是猜的，来自内核源码：
         *
         *   main-all.js（midp/midp.js）里有两张对称的表：
         *     keyMap[gameAction] = keyCode     （游戏动作 → 设备键码）
         *     gameKeys[keyCode]  = gameAction  （设备键码 → 游戏动作）
         *
         * 有效的「方向键码」是 119 / 97 / 115 / 100 / 32，也就是**小写字母**
         * w / a / s / d / 空格 的 ASCII 码，而不是方向键的键码 37~40。
         *
         * ★ 这一点必须记清楚：浏览器给字母键的 ev.which 是**大写** ASCII
         *   （按 D 得到 68，不是 100），方向键给的是 37~40。所以内核自带的
         *   window keydown 监听永远命中不了方向——实测按方向键、WASD
         *   画面均无变化，而注入 119/115/100 都有动作。
         *   上游是靠 game-ui.js 里直接调 MIDP.sendKeyPress(119) 来绕过这件事的。
         *
         * 数字键 48~57、星号 42、井号 35 与 MIDP 的 KEY_NUM* / KEY_STAR /
         * KEY_POUND 一致，可以原样送。8 是 SYSTEM_KEY_CLEAR（退格）。
         * -6 / -7 是 MIDP 的 KEY_SOFTKEY1 / 2；本内核的构建里没有导出这两个
         * 常量，但游戏普遍直接比较 -6 / -7（例如自研的推箱子），所以照送。
         */
        var CONTROL_CODES = {
          up: 119,
          down: 115,
          left: 97,
          right: 100,
          fire: 32,
          soft1: -6,
          soft2: -7,
          clear: 8,
          star: 42,
          pound: 35,
          num0: 48,
          num1: 49,
          num2: 50,
          num3: 51,
          num4: 52,
          num5: 53,
          num6: 54,
          num7: 55,
          num8: 56,
          num9: 57,
        }

        function send(type, payload) {
          if (!parentWindow) return
          try {
            parentWindow.postMessage({ v: PROTOCOL, type: type, payload: payload || {} }, targetOrigin)
          } catch (err) {
            // 父窗口已销毁时 postMessage 会抛 InvalidStateError，属于正常收尾，不升级为错误。
          }
        }

        function fail(code, message) {
          if (phase === 'failed') return
          phase = 'failed'
          stopPolling()
          send('runtime:error', { code: code, message: String(message) })
        }

        function stopPolling() {
          if (pollTimer) {
            clearTimeout(pollTimer)
            pollTimer = 0
          }
        }

        function warnOnce(key, message) {
          if (warnedKeys[key]) return
          warnedKeys[key] = true
          // 用 warn 而不是让它变成运行时错误：按错一个键不该把整个游戏打死，
          // 但也不能静默 —— 静默会让「键位表与宿主表不同步」这种 bug 永远查不出来。
          console.warn('[host] ' + message)
        }

        /*
         * 把一次逻辑按键翻成内核的设备键码并送进 JVM。
         *
         * 返回 false 表示没送出去，原因可能是「还没到时候」：
         * main-all.js 之前 MIDP 还不存在，JVM 还没有前台 Displayable 时
         * sendNativeEventToForeground 自己会丢弃。这些都不算错误。
         */
        function sendControl(control, keyPhase) {
          var code = CONTROL_CODES[control]
          if (typeof code === 'undefined') {
            warnOnce('control:' + control, '未知控制名：' + control)
            return false
          }
          if (keyPhase !== 'press' && keyPhase !== 'release') {
            warnOnce('edge:' + keyPhase, '未知按键阶段：' + keyPhase)
            return false
          }
          if (typeof MIDP === 'undefined') return false
          if (typeof MIDP.sendKeyPress !== 'function' || typeof MIDP.sendKeyRelease !== 'function') {
            return false
          }

          if (keyPhase === 'press') {
            heldControls[control] = true
            MIDP.sendKeyPress(code)
          } else {
            delete heldControls[control]
            MIDP.sendKeyRelease(code)
          }
          return true
        }

        /*
         * 抬起所有按下的键。
         *
         * 不是防御性冗余：按住方向键时把焦点切走，keyup 永远不会到达，
         * JVM 里那只键会一直处于按下态 —— 回到游戏时角色会自己往前走。
         * 窗口失焦、页面隐藏都要走这里。
         */
        function releaseAllControls() {
          for (var control in heldControls) {
            if (Object.prototype.hasOwnProperty.call(heldControls, control)) {
              sendControl(control, 'release')
            }
          }
          heldControls = {}
        }

        /*
         * 输入框激活时不能拦键：内核用它自己的 contenteditable 做文本输入，
         * 拦掉会把打字吃掉。
         */
        function isTextEditing() {
          var editor = document.getElementById('textarea-editor')
          if (!editor) return false
          if (editor.style.display === 'none') return false
          return document.activeElement === editor
        }

        /*
         * 物理键盘接管。
         *
         * ★ 必须用**捕获阶段**，并且 stopImmediatePropagation：
         *   内核自己在 window 上注册了冒泡阶段的 keydown/keyup，会把 ev.which
         *   原样当成设备键码送进去。不掐断它，数字键会被送两次
         *   （原生 53 + 我们注入的 53），表现成按一下走两步。
         *
         * 只拦映射表里的键，其余一律放行 —— 这样文本框、浏览器快捷键都还能用。
         */
        function onPhysicalKeyDown(event) {
          var control = keymap[event.code]
          if (!control) return
          if (isTextEditing()) return

          event.preventDefault()
          event.stopImmediatePropagation()

          // 自动重复不转发：内核那边按一次只发一个 keyPressed，
          // 长按的连续触发由游戏自己用 getKeyStates 轮询（掩码在抬起前一直有效）。
          if (event.repeat) return
          sendControl(control, 'press')
        }

        function onPhysicalKeyUp(event) {
          var control = keymap[event.code]
          if (!control) return
          if (isTextEditing()) return

          event.preventDefault()
          event.stopImmediatePropagation()
          sendControl(control, 'release')
        }

        /** 外壳下发的表不可信：只收「字符串 → 字符串」的项。 */
        function normalizeKeymap(raw) {
          var out = {}
          if (!raw || typeof raw !== 'object') return out
          for (var code in raw) {
            if (!Object.prototype.hasOwnProperty.call(raw, code)) continue
            if (typeof raw[code] === 'string') out[code] = raw[code]
          }
          return out
        }

        /*
         * 内核的 config 是一个普通全局对象，字段全部是「读到就用」。
         * 这里只给能确认有消费方的字段，不猜。
         */
        function buildConfig(mainClass, jarObjectUrl) {
          return {
            // MIDP 的启动器类，不是游戏主类。游戏主类由内核从 MANIFEST 的 MIDlet-1 推断
            // 后写回 config.midletClassName（本地补丁 inferMidletClassName）。
            main: 'com/sun/midp/main/MIDletSuiteLoader',
            midletClassName: mainClass || '',
            jars: jarsShim(jarObjectUrl),
            args: [],
            // 内核会对它调 .has()，必须是 Set，不能是对象或数组。
            ignoredFiles: new Set(),
            // 置空：让内核用 #display 的 clientWidth/clientHeight 作为屏幕尺寸。
            // 非空会走 documentElement 的 chrome 计算，那是给独立页面用的，iframe 里会算错。
            autosize: '',
            gamepad: 'no',
            downloadJAD: '',
            jad: '',
            // JIT 阈值：不设也能跑，但会让「多少次调用后编译」恒为假，帧率明显偏低。
            invokeThreshold: 10,
            backwardBranchThreshold: 10,
          }
        }

        /*
         * ★ config.jars 的类型契约是「有 split 方法的字符串」，因为它要支持多包：
         *     jars = jars.concat(config.jars.split(":"))
         * 而 blob URL 形如 blob:http://host/uuid，自带两个冒号，用字符串会被拆成 4 段、
         * 全部加载失败（表现为停在启动层，无可见错误）。
         * 所以传一个只有 split 的最小替身。内核只在这一处消费它，替身足够。
         */
        function jarsShim(url) {
          return {
            split: function () {
              return [url]
            },
          }
        }

        function loadScript(url) {
          return new Promise(function (resolve, reject) {
            var el = document.createElement('script')
            el.src = url
            el.async = false
            el.onload = function () {
              resolve()
            }
            el.onerror = function () {
              reject(new Error('脚本加载失败：' + url))
            }
            document.head.appendChild(el)
          })
        }

        /*
         * 判定「出画面」。
         *
         * ★ 分两步，都不能省：
         *   1. 不在源画布上 getContext：内核已持有它的 2d 上下文，再取一次属于抢渲染
         *      上下文，会把画面顶成 0 FPS（本项目在旧宿主上踩过）。
         *   2. 不能只看 toDataURL 的长度：旧结论「空白 PNG 只有几百字节」是针对小画布的，
         *      358×638 的纯黑画布也能压到 9 KB，长度判据会直接判成「已出画面」。
         *
         * 所以缩绘到一块离屏小画布上统计颜色数：纯色（含纯黑）只有一种，
         * 真正的游戏画面至少两种颜色。drawImage 只读源画布，不抢上下文。
         */
        var probeCanvas = document.createElement('canvas')
        probeCanvas.width = 64
        probeCanvas.height = 64
        var probeCtx = null

        function probePainted(source) {
          if (!source.width || !source.height) return false
          if (!probeCtx) {
            probeCtx = probeCanvas.getContext('2d', { willReadFrequently: true })
          }
          if (!probeCtx) return false
          try {
            probeCtx.clearRect(0, 0, probeCanvas.width, probeCanvas.height)
            probeCtx.drawImage(
              source,
              0,
              0,
              source.width,
              source.height,
              0,
              0,
              probeCanvas.width,
              probeCanvas.height,
            )
            var data = probeCtx.getImageData(0, 0, probeCanvas.width, probeCanvas.height).data
            var colors = new Set()
            for (var i = 0; i < data.length; i += 4) {
              if (data[i + 3] === 0) continue
              colors.add((data[i] << 16) | (data[i + 1] << 8) | data[i + 2])
              // 超过两种就够判定了，不必扫完 4096 个像素。
              if (colors.size > 1) return true
            }
            return false
          } catch (err) {
            return false
          }
        }

        /*
         * ───────────────────────── 存档快照 ─────────────────────────
         *
         * 内核的 RMS 数据落在 /RecordStore 下的文件里，但它的持久化不可靠：
         * pagehide 里才发起的 IDB 事务在 iframe 被摘除后不完成（实测），
         * 定时落盘又要等启动 20 秒后才开始。所以真相由外壳持有，
         * 这里只负责「读出来交给外壳」与「启动前灌进去」。
         *
         * 详见 ADR 0005。
         */

        /** 递归列出 /RecordStore 下的全部文件路径。目录不存在视为「没有存档」。 */
        function listSnapshotPaths() {
          if (typeof fs === 'undefined' || !fs || typeof fs.list !== 'function') return []
          var out = []
          ;(function walk(dir) {
            var entries
            try {
              entries = fs.list(dir)
            } catch (err) {
              // 目录不存在时 fs.list 会 throw。没有存档不是错误。
              return
            }
            for (var i = 0; i < entries.length; i++) {
              var entry = entries[i]
              var isDir = entry.charAt(entry.length - 1) === '/'
              var name = isDir ? entry.slice(0, -1) : entry
              var full = dir + '/' + name
              if (isDir) walk(full)
              else out.push(full)
            }
          })(SNAPSHOT_ROOT)
          return out
        }

        /**
         * 读一份完整快照。
         *
         * 读的是**已提交**的内容：fs.getBlob 拿的是 store 里最后一次 flush 的 Blob，
         * 正在写、还没 commit 的文件拿不到新值 —— 这正是我们要的语义。
         */
        function readSnapshot() {
          var paths = listSnapshotPaths()
          if (!paths.length) return Promise.resolve([])

          return Promise.all(
            paths.map(function (path) {
              return new Promise(function (resolve) {
                var blob = null
                try {
                  blob = fs.getBlob(path)
                } catch (err) {
                  resolve(null)
                  return
                }
                if (!blob) {
                  resolve(null)
                  return
                }
                if (blob.size === 0) {
                  resolve({ path: path, bytes: new Uint8Array(0) })
                  return
                }
                var reader = new FileReader()
                reader.onload = function () {
                  resolve({ path: path, bytes: new Uint8Array(reader.result) })
                }
                reader.onerror = function () {
                  // 单个文件读失败不该让整份快照作废，但要留痕。
                  console.warn('[host] 读存档文件失败：' + path)
                  resolve(null)
                }
                reader.readAsArrayBuffer(blob)
              })
            }),
          ).then(function (items) {
            return items.filter(function (item) {
              return item !== null
            })
          })
        }

        /**
         * 廉价的「变了没有」指纹：路径 + size + mtime。
         *
         * 不读内容。存档通常几十 KB，但每 2 秒读一次内容+算哈希是白烧 CPU；
         * 而且 stat 反映的就是「已提交」的状态，与 readSnapshot 的口径一致。
         */
        function snapshotSignature() {
          var paths
          try {
            paths = listSnapshotPaths()
          } catch (err) {
            return ''
          }
          var parts = []
          for (var i = 0; i < paths.length; i++) {
            var stat = null
            try {
              stat = fs.stat(paths[i])
            } catch (err) {
              stat = null
            }
            parts.push(paths[i] + ':' + (stat ? String(stat.size) + ':' + String(stat.mtime) : '?'))
          }
          return parts.sort().join('|')
        }

        /**
         * 校验外壳下发的恢复文件。
         *
         * 宿主不信任这条通道：路径必须落在 /RecordStore 下，否则一个写错的
         * 恢复包就能改内核的其他文件（比如把证书库换成别的）。
         */
        function normalizeSaveFiles(raw) {
          var out = []
          if (!raw || typeof raw.length !== 'number') return out
          for (var i = 0; i < raw.length; i++) {
            var item = raw[i]
            if (!item || typeof item.path !== 'string') continue
            if (!item.bytes || typeof item.bytes.byteLength !== 'number') continue
            if (item.path !== SNAPSHOT_ROOT && item.path.indexOf(SNAPSHOT_ROOT + '/') !== 0) {
              console.warn('[host] 丢弃越界的恢复路径：' + item.path)
              continue
            }
            out.push({ path: item.path, bytes: new Uint8Array(item.bytes) })
          }
          return out
        }

        /**
         * 打开内核的存储库；库还不存在时返回 null。
         *
         * ★ 不能盲目 `open(IDB_NAME, IDB_VERSION)`：库不存在时它会**创建一个
         *   版本号是 4、却没有任何表**的空库。内核随后 open 同版本不会触发
         *   upgradeneeded，于是 `transaction(IDB_STORE)` 直接抛 NotFoundError，
         *   表现是「启动层不动、控制台没有任何报错」。
         */
        function openKernelStore() {
          if (typeof indexedDB === 'undefined') return Promise.resolve(null)

          function openExisting() {
            return new Promise(function (resolve) {
              var req = indexedDB.open(IDB_NAME, IDB_VERSION)
              req.onupgradeneeded = function () {
                // 库存在但版本更低（或探测失败）：让内核自己去升级，本次放弃恢复。
                try {
                  req.transaction.abort()
                } catch (err) {
                  /* ignore */
                }
                resolve(null)
              }
              req.onsuccess = function () {
                resolve(req.result)
              }
              req.onerror = function () {
                resolve(null)
              }
            })
          }

          if (typeof indexedDB.databases !== 'function') return openExisting()
          return indexedDB.databases().then(
            function (list) {
              var exists = false
              for (var i = 0; i < list.length; i++) {
                if (list[i].name === IDB_NAME) exists = true
              }
              return exists ? openExisting() : null
            },
            function () {
              return openExisting()
            },
          )
        }

        /**
         * 启动前把快照写进内核的存储库。
         *
         * 即使 files 为空也要执行：空的恢复意味着「这款游戏还没有存档」，
         * 此时必须把上一款游戏留下的 /RecordStore 清掉，否则同名 RMS 会串味。
         */
        function restoreIntoIdb(files) {
          return openKernelStore().then(function (db) {
            if (!db) return 'skipped'
            return new Promise(function (resolve) {
              var tx
              try {
                tx = db.transaction(IDB_STORE, 'readwrite')
              } catch (err) {
                console.warn('[host] 存储库不可写，跳过存档恢复：' + err)
                resolve('unavailable')
                return
              }

              var store = tx.objectStore(IDB_STORE)
              var cursorReq = store.openCursor()
              cursorReq.onerror = function () {
                resolve('cursor-error')
              }
              cursorReq.onsuccess = function (event) {
                var cursor = event.target.result
                if (cursor) {
                  var key = String(cursor.key)
                  if (key === SNAPSHOT_ROOT || key.indexOf(SNAPSHOT_ROOT + '/') === 0) {
                    cursor.delete()
                  }
                  cursor.continue()
                  return
                }

                // 目录记录要补上：内核的 fs.exists 会查它，缺了会让 RMS 报「打开失败」。
                store.put({
                  pathname: SNAPSHOT_ROOT,
                  isDir: true,
                  parentDir: '/',
                  mtime: Date.now(),
                })

                for (var i = 0; i < files.length; i++) {
                  var file = files[i]
                  var slash = file.path.lastIndexOf('/')
                  store.put({
                    pathname: file.path,
                    isDir: false,
                    parentDir: slash > 0 ? file.path.slice(0, slash) : '/',
                    size: file.bytes.byteLength,
                    mtime: Date.now(),
                    data: new Blob([file.bytes]),
                  })
                }

                tx.oncomplete = function () {
                  resolve(files.length ? 'restored' : 'cleared')
                }
                tx.onerror = function () {
                  resolve('error:' + tx.error)
                }
                tx.onabort = function () {
                  resolve('abort')
                }
              }
            })
          })
        }

        /** 静默期自动归档：兜「直接关页面 / 刷新」这条最容易被忽视的退出路径。 */
        function startIdleWatch() {
          stopIdleWatch()
          idleSignature = snapshotSignature()
          // 启动时的状态就是刚恢复/刚开局的存档，不需要再推一遍。
          archivedSignature = idleSignature
          idleStable = 0
          idleTimer = setInterval(tickIdle, IDLE_INTERVAL_MS)
        }

        function stopIdleWatch() {
          if (idleTimer) {
            clearInterval(idleTimer)
            idleTimer = 0
          }
        }

        function tickIdle() {
          if (phase !== 'running') return
          var signature = snapshotSignature()
          if (signature !== idleSignature) {
            idleSignature = signature
            idleStable = 0
            return
          }
          idleStable++
          if (idleStable < IDLE_STABLE_TICKS) return
          if (signature === archivedSignature) return
          // 先记账再读：读是异步的，期间可能又变；重复推送会让外壳反复写归档。
          archivedSignature = signature
          readSnapshot().then(function (files) {
            if (phase !== 'running') return
            send('runtime:saves', { reason: 'idle', files: files })
          })
        }

        /*
         * 退出前导出。
         *
         * 顺序不能反：必须先读快照、发出去，再回 stopped —— 外壳拿到 stopped
         * 就会拆 iframe，那时候内核的 fs 已经不在了。
         */
        function flushAndShutdown() {
          stopIdleWatch()
          readSnapshot()
            .then(function (files) {
              send('runtime:saves', { reason: 'stop', files: files })
            })
            .catch(function () {
              /* 读失败也要让退出继续，否则用户卡在游戏里出不来 */
            })
            .then(function () {
              shutdown()
              send('runtime:state', { state: 'stopped', reason: 'host-shutdown' })
            })
        }

        function watchForFirstPaint() {
          var canvas = document.getElementById('canvas')
          var deadline = Date.now() + START_TIMEOUT_MS

          function tick() {
            pollTimer = 0
            if (phase === 'failed' || phase === 'stopped') return
            if (probePainted(canvas)) {
              phase = 'running'
              send('runtime:state', { state: 'running', reason: 'first-paint' })
              // 出画之后才开始看存档：之前 fs 还没装配好，读也没意义。
              startIdleWatch()
              return
            }
            if (Date.now() > deadline) {
              fail('TIMEOUT', '内核在 ' + START_TIMEOUT_MS / 1000 + ' 秒内没有产生画面')
              return
            }
            pollTimer = setTimeout(tick, POLL_INTERVAL_MS)
          }

          pollTimer = setTimeout(tick, POLL_INTERVAL_MS)
        }

        function boot(jarBytes, options) {
          if (phase !== 'boot') {
            fail('INVALID_TRANSITION', '宿主已启动过，不能重复启动')
            return
          }
          if (!(jarBytes instanceof ArrayBuffer) || jarBytes.byteLength === 0) {
            fail('PACKAGE_INVALID', '没有收到有效的程序包字节')
            return
          }

          phase = 'loading'
          send('runtime:state', { state: 'loading', reason: 'host-boot' })

          keymap = normalizeKeymap(options && options.keymap)

          jarUrl = URL.createObjectURL(new Blob([jarBytes], { type: 'application/java-archive' }))

          /*
           * 内核的 initFS 会无条件加载 APP_BASE_DIR + "certs/_main.ks"（MIDP 的证书库），
           * 少这个全局会直接 ReferenceError，且失败只出现在加载链的 reject 里。
           * 置空字符串是为了让路径走 <base> 的相对解析，指向产物目录而不是宿主目录。
           */
          window.APP_BASE_DIR = ''

          /*
           * MIDlet 是内核的配置载体，不是游戏本体（名字容易误解）。
           * 上游外壳在页面里预置了它，内核的短信/后台服务相关实现会直接读这些字段。
           * V1.0 不做短信与后台，但对象必须存在 —— 缺了会在对应 native 里抛
           * ReferenceError，且那个调用点不属于主流程，症状是「画面不出来但无报错」。
           */
          window.MIDlet = {
            name: 'aMIDlet',
            SMSDialogVerificationText: '',
            SMSDialogTimeout: 300000,
            SMSDialogTimeoutText: 'left',
            SMSDialogReceiveFilter: function (message) {
              return message
            },
            wakeUpAlarm: 60000,
            shouldStartBackgroundService: function () {
              return false
            },
          }

          // config 必须在 main-all.js 之前就位：它在解析期就会读 config.jars / config.main。
          window.config = buildConfig(
            options && options.mainClass,
            jarUrl,
          )

          /*
           * 加载顺序由产物的真实依赖决定，不是文档字面顺序：
           *   native.js 先 —— j2me.js 一执行就会摸 ASM（wasm 导出对象）；
           *   j2me.js 次   —— 定义 JVM / Native / J2ME 等全局，main-all.js 全靠它们；
           *   main-all.js 末 —— 末尾是立即执行的顶层语句，前面两件必须已就位。
           * 旧宿主页的装载器（load-versioned.js）里，顺序同样是 native 在 j2me 之前。
           */
          /*
           * 存档恢复必须排在装载内核之前，而且是**必须等它结束**：
           * 内核的 fs.init 会在 main-all.js 执行时把库里现有的记录读进内存，
           * 之后没有任何「已 init、MIDlet 未跑」的插入点。晚一步，
           * MIDlet 就已经读过档了。详见 ADR 0005。
           */
          restoreIntoIdb(normalizeSaveFiles(options && options.restore))
            .catch(function (err) {
              // 恢复失败不拦启动：玩不了比存档没接上更糟。但必须留痕。
              console.warn('[host] 存档恢复未完成：' + err)
              return 'failed'
            })
            .then(function (result) {
              if (result === 'skipped' || result === 'unavailable') {
                console.warn('[host] 存档恢复被跳过（' + result + '），本次沿用库里的现有数据')
              }
              return loadScript('native.js')
            })
            .then(function () {
              // wasm 版 native 把导出挂在 Module.asm；内核读的是全局 ASM。
              // 这是 wasm 化之后新旧产物之间唯一的接口差异，必须在这里补齐。
              if (typeof window.ASM === 'undefined' && window.Module && window.Module.asm) {
                window.ASM = window.Module.asm
              }
              return loadScript('j2me.js')
            })
            .then(function () {
              return loadScript('main-all.js')
            })
            .then(function () {
              // main-all.js 末尾会自己 Promise.all(...).then(start)，这里没有可等待的句柄，
              // 只能转去观察画布。这正是「必须由外壳主动压超时」的原因。
              send('runtime:state', { state: 'loading', reason: 'kernel-loaded' })
              watchForFirstPaint()
            })
            .catch(function (err) {
              fail('INTERNAL', err && err.message ? err.message : err)
            })
        }

        function shutdown() {
          phase = 'stopped'
          stopPolling()
          stopIdleWatch()
          if (jarUrl) {
            URL.revokeObjectURL(jarUrl)
            jarUrl = null
          }
        }

        window.addEventListener('message', function (event) {
          // 同源 + 必须来自父窗口。两者缺一不可，否则页面上任何脚本都能驱动内核。
          if (event.origin !== targetOrigin) return
          if (!parentWindow || event.source !== parentWindow) return

          var data = event.data
          if (!data || data.v !== PROTOCOL) {
            fail('PROTOCOL_MISMATCH', '宿主与外壳的协议版本不一致')
            return
          }

          switch (data.type) {
            case 'runtime:launch':
              boot(data.payload.bytes, data.payload)
              break
            case 'runtime:key':
              // 按键不需要等任何响应，也不改变宿主生命周期：
              // 送不出去（内核还没装配好）就丢掉，外壳不该为一次按键让整局停下来。
              sendControl(data.payload.control, data.payload.phase)
              break
            case 'runtime:stop':
              // 先导快照再回 stopped：外壳一收到 stopped 就会拆 iframe。
              flushAndShutdown()
              break
            case 'runtime:snapshot':
              // 用户点了导出，不能等静默期的 4 秒滞后。
              readSnapshot().then(function (files) {
                send('runtime:saves', { reason: 'manual', files: files })
              })
              break
            default:
              // 未知指令不静默吞掉：静默会让外壳以为指令生效了，问题推迟到更难查的地方。
              fail('INTERNAL', '未知指令：' + String(data.type))
          }
        })

        // 内核的失败大多不进 Promise，而是打 console / 抛在事件回调里。
        // 不接住的话，外壳只能看到「超时」，丢掉真正的原因。
        window.addEventListener('error', function (event) {
          if (phase === 'failed' || phase === 'stopped' || phase === 'running') return
          // 带上文件与行号：内核对外的错误信息常常只有一句话，不带位置就没法定位。
          var where = event.filename ? ' @' + String(event.filename).split('/').pop() + ':' + event.lineno : ''
          fail('INTERNAL', (event.message || '内核脚本错误') + where)
        })
        window.addEventListener('unhandledrejection', function (event) {
          if (phase === 'failed' || phase === 'stopped' || phase === 'running') return
          var reason = event.reason
          fail('INTERNAL', reason && reason.message ? reason.message : String(reason))
        })

        // 捕获阶段注册，注册时机不影响优先级：捕获一定先于内核在冒泡阶段的监听。
        // 此时 keymap 还是空的，所以「还没启动就按了键」不会被误拦。
        window.addEventListener('keydown', onPhysicalKeyDown, true)
        window.addEventListener('keyup', onPhysicalKeyUp, true)
        // 失焦 / 隐藏时抬键，避免 JVM 里留下按下的键（见 releaseAllControls）
        window.addEventListener('blur', releaseAllControls)
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) releaseAllControls()
        })

        send('host:ready', {
          protocolVersion: PROTOCOL,
          // 能力如实声明。没实现的一律 false —— 外壳据此隐藏按钮，而不是让用户点了才发现不行。
          capabilities: {
            speedControl: false,
            audio: false,
            frameTicks: false,
            pauseResume: false,
            keyInput: true,
            // 内核的持久化不可靠，但外壳能读快照、能在启动前灌回去，
            // 所以「存档」这项能力是真的有，不是声明着好看（见 ADR 0005）。
            saves: true,
          },
        })
      })()
    </script>
  </body>
</html>
